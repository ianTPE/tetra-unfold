<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Flight Replay · 飛行重播</title>
<style>
  :root { --bg: #cfe9f0; --panel: rgba(255,255,255,.96); --text: #1d3340; --muted: #5b7380; --line: #d3e2e8; --accent: #1f8fbf; --field: #fff; --grid: #dbe6ea; color-scheme: light dark; }
  :root[data-theme="light"] { color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0f1a20; --panel: rgba(18,30,38,.96); --text: #e3eef2; --muted: #96aeb9; --line: #2c4250; --accent: #5cc0e8; --field: #1b2c36; --grid: #2c4250; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #0f1a20; --panel: rgba(18,30,38,.96); --text: #e3eef2; --muted: #96aeb9; --line: #2c4250; --accent: #5cc0e8; --field: #1b2c36; --grid: #2c4250; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif; }
  a { color: var(--accent); }
  #map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #map.dragging { cursor: grabbing; }
  #dock {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
    display: grid; grid-template-columns: 270px minmax(200px, 1fr) 220px 330px; gap: 16px; padding: 10px 16px;
  }
  h1 { font-size: 15px; margin: 0; }
  .tag { color: var(--muted); font-size: 11.5px; }
  .clock { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; margin-top: 2px; }
  #phase { font-size: 12.5px; color: var(--muted); min-height: 18px; }
  .hud { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; }
  .hud div { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13.5px; white-space: nowrap; }
  .hud small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
  .cap { font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
  canvas.inset { display: block; width: 100%; border-radius: 6px; }
  #chart { height: 84px; cursor: crosshair; touch-action: none; }
  #flat { height: 108px; }
  .controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .controls + .controls { margin-top: 6px; }
  button, select { font: inherit; font-size: 13px; color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
  button.main { background: var(--accent); color: #fff; border-color: var(--accent); min-width: 58px; }
  input[type="range"] { width: 100%; accent-color: var(--accent); margin: 3px 0 0; display: block; }
  .note { color: var(--muted); font-size: 11px; margin: 5px 0 0; line-height: 1.35; }
  .note.wide { grid-column: 1 / -1; margin: -6px 0 0; }
  #tip { position: fixed; display: none; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; font-size: 12px; z-index: 5; font-variant-numeric: tabular-nums; white-space: nowrap; }
  @media (max-width: 1050px) {
    #dock { grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 8px 12px; max-height: 50dvh; overflow-y: auto; }
    .flatbox { display: none; }
  }
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="dock">
  <div>
    <h1 id="title"></h1>
    <div class="tag" id="subtitle"></div>
    <div class="clock" id="clock">T+00:00:00</div>
    <div id="phase"></div>
    <div class="hud">
      <div><small data-t="altitude"></small><span id="alt"></span></div>
      <div><small data-t="speed"></small><span id="speed"></span></div>
      <div><small data-t="distance"></small><span id="dist"></span></div>
    </div>
  </div>
  <div>
    <div class="cap" data-t="chartCap"></div>
    <canvas class="inset" id="chart"></canvas>
    <input type="range" id="scrub" min="0" step="1" value="0" data-a="timeAria">
  </div>
  <div class="flatbox">
    <div class="cap" data-t="flatCap"></div>
    <canvas class="inset" id="flat"></canvas>
  </div>
  <div>
    <div class="controls"><select id="flight" data-a="flightAria"></select></div>
    <div class="controls">
      <button class="main" id="play"></button>
      <select id="rate" data-a="rateAria">
        <option value="10">×10</option><option value="30">×30</option><option value="60" selected>×60</option><option value="120">×120</option><option value="600">×600</option><option value="1800">×1800</option>
      </select>
      <select id="lang" aria-label="Language">
        <option value="zh-Hant">繁體中文</option><option value="en">English</option>
      </select>
    </div>
    <div class="controls">
      <button id="toRoute" data-t="toRoute"></button>
      <button id="toNorth" data-t="toNorth"></button>
      <button id="toSouth" data-t="toSouth"></button>
    </div>
    <p class="note"><span data-t="hint"></span> <a id="back" data-t="back"></a></p>
  </div>
  <p class="note wide"><span id="note"></span> <span id="sources"></span></p>
</div>
<div id="tip"></div>

<!-- integrity：CDN 上的檔案被改過就不執行。換版本時要重算雜湊 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js" integrity="sha384-9dCJK6nh7skY14HrcvlLYlFga9/MehJjL9ONWRflmiXNRuf8p2jiF4Y5PR881PTq" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="tetra-map.js"></script>
<script>
// 這一頁只播放資料檔，不計算軌跡。要加一次飛行，在 flights/ 放一個資料檔，再加到這個清單（格式見 README）
const FLIGHTS = [
  { id: 'starship-11', name: { 'zh-Hant': 'Starship 第 11 次試飛（重建）', en: 'Starship Flight 11 (reconstruction)' } },
  { id: 'global-hawk-hs3', name: { 'zh-Hant': 'NASA Global Hawk（實測）', en: 'NASA Global Hawk (measured)' } },
];

const TEXT = {
  'zh-Hant': {
    pageTitle: '飛行重播', altitude: '高度', speed: '速度', distance: '地面距離', chartCap: '高度與飛行時間',
    flatCap: '同一條路線，傳統經緯度地圖', toRoute: '整段行程', toNorth: '北極在上', toSouth: '南極在下',
    play: '播放', pause: '暫停', replay: '重播', north: '↑ 北', south: '↓ 南', pole: ['北極', '南極'], ocean: '海洋', min: '分',
    hint: '上下拖曳：北極、南極沿中央的邊移動。左右拖曳：轉動經度。', back: '回世界地圖', timeAria: '飛行時間', rateAria: '播放速度', flightAria: '選擇飛行', fail: '載入失敗', hr: '小時',
  },
  en: {
    pageTitle: 'Flight Replay', altitude: 'Altitude', speed: 'Speed', distance: 'Ground distance', chartCap: 'Altitude and flight time',
    flatCap: 'The same route on an ordinary map', toRoute: 'Whole route', toNorth: 'North Pole up', toSouth: 'South Pole down',
    play: 'Play', pause: 'Pause', replay: 'Replay', north: '↑ N', south: '↓ S', pole: ['North Pole', 'South Pole'], ocean: 'Ocean', min: 'min',
    hint: 'Drag up and down to slide the poles along the central edge. Drag sideways to turn the longitude.', back: 'Back to the world map', timeAria: 'Flight time', rateAria: 'Playback speed', flightAria: 'Choose a flight', fail: 'Could not load', hr: 'h',
  },
};
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const browserLang = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh-Hant' : 'en';
let lang = TEXT[params.get('lang')] ? params.get('lang') : browserLang;
const t = key => TEXT[lang][key];
const pick = o => o[lang] ?? o.en ?? Object.values(o)[0];   // 資料檔裡的文字

let D, R, vectors = [], endT = 0, altMax = 200, now = 0, playing = false, last = 0;
let route = [], flyId = 0, started = false;
let flightId = FLIGHTS.some(f => f.id === params.get('flight')) ? params.get('flight') : FLIGHTS[0].id;
const visibleH = () => canvas.clientHeight - $('dock').offsetHeight;

// t 秒時的數值：在相鄰兩列之間內插。位置用向量內插，跨過換日線也不會出錯
function rowBefore(time) {
  let a = 0, b = R.t.length - 1;
  while (b - a > 1) { const m = (a + b) >> 1; if (R.t[m] <= time) a = m; else b = m; }
  return a;
}
function sampleAt(time) {
  const a = rowBefore(time), b = Math.min(a + 1, R.t.length - 1);
  const f = R.t[b] > R.t[a] ? Math.min(1, Math.max(0, (time - R.t[a]) / (R.t[b] - R.t[a]))) : 0;
  const mix = k => R[k][a] + (R[k][b] - R[k][a]) * f;
  const va = vectors[a], vb = vectors[b];
  return { v: norm([va[0] + (vb[0] - va[0]) * f, va[1] + (vb[1] - va[1]) * f, va[2] + (vb[2] - va[2]) * f]), alt: mix('alt'), speed: mix('speed'), dist: mix('dist') };
}

// ---- 路線投影。從行程中點往兩端接，同一份拷貝連到底，整段只畫這一條
function chain() {
  const n = R.t.length, step = Math.max(1, Math.ceil(n / 1000)), mid = Math.floor(n / 2);
  const m = nearestCopy(geoToPlane(vectors[mid]), [MAP_W / 2, MAP_H / 2]);
  const back = [], fwd = [];
  let prev = m;
  for (let i = mid - step; i >= 0; i -= step) { prev = nearestCopy(geoToPlane(vectors[i]), prev); back.push([R.t[i], prev]); }
  if (!back.length || back[back.length - 1][0] !== R.t[0]) { prev = nearestCopy(geoToPlane(vectors[0]), prev); back.push([R.t[0], prev]); }
  prev = m;
  for (let i = mid + step; i < n; i += step) { prev = nearestCopy(geoToPlane(vectors[i]), prev); fwd.push([R.t[i], prev]); }
  if (!fwd.length || fwd[fwd.length - 1][0] !== R.t[n - 1]) { prev = nearestCopy(geoToPlane(vectors[n - 1]), prev); fwd.push([R.t[n - 1], prev]); }
  return [...back.reverse(), [R.t[mid], m], ...fwd];
}
function rebuildRoute() { route = chain(); }

// 中央垂線固定在畫面正中：state.cx 永遠是 MAP_W / 2，也不用 roll。算出放得下整條路線的縮放
function fitFor(pts) {
  const w = canvas.clientWidth, vh = visibleH();
  let half = 0.02, y0 = Infinity, y1 = -Infinity;
  for (const [, P] of pts) { half = Math.max(half, Math.abs(P[0] - MAP_W / 2)); y0 = Math.min(y0, P[1]); y1 = Math.max(y1, P[1]); }
  const scale = Math.min((w / 2 - 34) / half, (vh - 56) / Math.max(0.02, y1 - y0));
  return { scale, cx: MAP_W / 2, cy: (y0 + y1) / 2 - (canvas.clientHeight - vh) / 2 / scale };
}
function fitWholeMap() {
  const w = canvas.clientWidth, vh = visibleH();
  const scale = Math.min(w * 0.96 / MAP_W, vh * 0.94 / MAP_H);
  return { scale, cx: MAP_W / 2, cy: MAP_H / 2 - (canvas.clientHeight - vh) / 2 / scale };
}

// ---- 視野切換：有短暫動畫，看得出地球是沿著中央的邊移動
function viewTarget(yaw, pitch, wholeMap) {
  const k = [state.yaw, state.pitch];
  state.yaw = yaw; state.pitch = pitch; updateMatrix();
  const f = wholeMap ? fitWholeMap() : fitFor(chain());
  state.yaw = k[0]; state.pitch = k[1]; updateMatrix();
  return { yaw, pitch, ...f };
}
function flyTo(v, ms = 600, then) {
  const id = ++flyId, from = { yaw: state.yaw, pitch: state.pitch, scale: state.scale, cx: state.cx, cy: state.cy };
  const dy = ((v.yaw - from.yaw + 540) % 360) - 180, t0 = performance.now();
  state.roll = 0;
  const step = ts => {
    if (id !== flyId) return;
    const u = Math.max(0, Math.min(1, (ts - t0) / ms)), e = u * u * (3 - 2 * u);
    state.yaw = ((from.yaw + dy * e + 540) % 360) - 180;
    state.pitch = from.pitch + (v.pitch - from.pitch) * e;
    state.scale = from.scale * Math.pow(v.scale / from.scale, e);
    state.cx = from.cx + (v.cx - from.cx) * e;
    state.cy = from.cy + (v.cy - from.cy) * e;
    updateMatrix(); rebuildRoute();
    interacting = u < 1;
    draw(u < 1 ? 0.4 : 1);
    if (u < 1) requestAnimationFrame(step);
    else if (then) then();
  };
  requestAnimationFrame(step);
}
const goRoute = then => flyTo(viewTarget(D.view.yaw, D.view.pitch, false), 600, then);
const goPole = p => flyTo(viewTarget(0, p, true));

// ---- 地圖圖層：路線只畫中央這一份
const FLOWN = '#d9381e', AHEAD = 'rgba(30,45,60,.6)';
function strokeLine(pts, color, width, dash) {
  ctx.strokeStyle = color; ctx.lineWidth = width * dpr; ctx.setLineDash(dash ? dash.map(x => x * dpr) : []);
  ctx.beginPath();
  pts.forEach(([, P], i) => { const p = toScreen(P[0], P[1]); i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); });
  ctx.stroke(); ctx.setLineDash([]);
}
function pin(P, r, fill) {
  const p = toScreen(P[0], P[1]);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p[0], p[1], (r + 2) * dpr, 0, 7); ctx.fill();
  ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(p[0], p[1], r * dpr, 0, 7); ctx.fill();
}
function label(P, text, dy = 0) {
  const p = toScreen(P[0], P[1]);
  p[1] += dy * dpr;
  ctx.font = `600 ${12.5 * dpr}px system-ui, "Microsoft JhengHei", sans-serif`;
  const flip = p[0] + 10 * dpr + ctx.measureText(text).width > canvas.width - 8 * dpr, gap = (flip ? -10 : 10) * dpr;
  ctx.textAlign = flip ? 'right' : 'left'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 3.5 * dpr; ctx.strokeStyle = 'rgba(255,255,255,.92)'; ctx.lineJoin = 'round';
  ctx.strokeText(text, p[0] + gap, p[1]);
  ctx.fillStyle = '#1d3340'; ctx.fillText(text, p[0] + gap, p[1]);
}
function currentPoint(v) {
  let ref = route[0][1];
  for (const [k, P] of route) { if (k > now) break; ref = P; }
  return nearestCopy(geoToPlane(v), ref);
}
// 北極和南極在畫面上的位置，當作方向的參考
function poleMark(g, text) {
  const P = geoToPlane(g), w = canvas.clientWidth, h = canvas.clientHeight;
  const x0 = state.cx - w / 2 / state.scale, x1 = state.cx + w / 2 / state.scale, y0 = state.cy - h / 2 / state.scale, y1 = state.cy + h / 2 / state.scale;
  for (const [s, ox, oy] of copyTransforms(x0, x1, y0, y1)) {
    const X = s * P[0] + ox, Y = s * P[1] + oy;
    if (X < x0 || X > x1 || Y < y0 || Y > y1) continue;
    const p = toScreen(X, Y);
    ctx.font = `700 ${12 * dpr}px system-ui, "Microsoft JhengHei", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 3.5 * dpr; ctx.strokeStyle = 'rgba(255,255,255,.92)'; ctx.strokeText(text, p[0], p[1]);
    ctx.fillStyle = '#35566a'; ctx.fillText(text, p[0], p[1]);
  }
}
// 兩極常在畫面外，在中央垂線的上下兩端標出方向
function northSouth() {
  const x = toScreen(MAP_W / 2, 0)[0];
  ctx.font = `700 ${13 * dpr}px system-ui, "Microsoft JhengHei", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const [text, y, g] of [[t('north'), 14, [0, 0, 1]], [t('south'), visibleH() - 14, [0, 0, -1]]]) {
    // 那一極已經顯示在中央垂線的這一端時，就不重複標
    const P = geoToPlane(g), near = copyTransforms(state.cx - 0.01, state.cx + 0.01, state.cy - 2, state.cy + 2).some(([s, ox, oy]) => {
      const p = toScreen(s * P[0] + ox, s * P[1] + oy);
      return Math.hypot(p[0] - x, p[1] - y * dpr) < 40 * dpr;
    });
    if (near) continue;
    ctx.lineWidth = 4 * dpr; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.strokeText(text, x, y * dpr);
    ctx.fillStyle = '#1d3340'; ctx.fillText(text, x, y * dpr);
  }
}
mapHooks.layers = () => {
  if (!route.length) return;
  const cur = currentPoint(sampleAt(now).v);
  const flown = route.filter(([k]) => k <= now);
  flown.push([now, cur]);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  poleMark([0, 0, 1], t('pole')[0]);
  poleMark([0, 0, -1], t('pole')[1]);
  northSouth();
  strokeLine(route, 'rgba(255,255,255,.85)', 4);
  strokeLine(route, AHEAD, 1.6, [6, 5]);
  if (flown.length > 1) { strokeLine(flown, 'rgba(255,255,255,.95)', 6.5); strokeLine(flown, FLOWN, 3.2); }
  pin(route[0][1], 4.5, '#1d3340');
  pin(route[route.length - 1][1], 4.5, '#1d3340');
  pin(cur, 7, FLOWN);
  const narrow = canvas.clientWidth <= 640;
  label(route[0][1], pick(D.labels.start), narrow ? -15 : 0);
  label(route[route.length - 1][1], pick(D.labels.end), narrow ? 15 : 0);
};

let pending = false, interacting = false, settle = 0;
function requestDraw() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => { pending = false; draw(interacting ? 0.4 : 1); });
}
function touched() {
  interacting = true; requestDraw(); clearTimeout(settle);
  settle = setTimeout(() => { interacting = false; requestDraw(); }, 150);
}
// 只有飛行器在動時，底圖不必重算
function repaint() { ctx.drawImage(buf, 0, 0, canvas.width, canvas.height); drawOverlay(); }

// ---- 高度圖
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function sizeInset(c) {
  const r = c.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
  c.width = Math.max(1, r.width * d); c.height = Math.max(1, r.height * d);
  return [c.getContext('2d'), r.width, r.height, d];
}
// 座標軸的間隔：1、2、5 × 10ⁿ，最多 count 格
function niceStep(span, count) {
  const raw = span / count, e = 10 ** Math.floor(Math.log10(raw));
  return [1, 2, 5, 10].map(k => k * e).find(s => s >= raw);
}
const CH = { l: 34, r: 10, t: 5, b: 18 };
const chartX = (time, w) => CH.l + time / endT * (w - CH.l - CH.r);
const chartY = (a, h) => h - CH.b - a / altMax * (h - CH.t - CH.b);
function drawChart() {
  const [x, w, h, d] = sizeInset($('chart'));
  x.scale(d, d);
  x.font = '10.5px system-ui, "Microsoft JhengHei", sans-serif';
  x.strokeStyle = css('--grid'); x.fillStyle = css('--muted'); x.lineWidth = 1;
  x.textBaseline = 'middle'; x.textAlign = 'right';
  const yStep = niceStep(altMax, 3);
  for (let a = 0; a <= altMax; a += yStep) {
    const y = chartY(a, h); x.beginPath(); x.moveTo(CH.l, y); x.lineTo(w - CH.r, y); x.stroke();
    x.fillText(`${a}`, CH.l - 5, y);
  }
  x.textBaseline = 'alphabetic'; x.textAlign = 'center';
  // 兩小時以上用小時當單位
  const unit = endT > 7200 ? 3600 : 60, tStep = niceStep(endT / unit, 4);
  for (let m = 0; m * unit <= endT; m += tStep) x.fillText(`${m} ${unit === 60 ? t('min') : t('hr')}`, chartX(m * unit, w), h - 3);
  const line = (upto, color) => {
    x.strokeStyle = color; x.lineWidth = 2; x.lineJoin = 'round'; x.beginPath();
    let started2 = false;
    for (let i = 0; i < R.t.length && R.t[i] <= upto; i++) {
      const X = chartX(R.t[i], w), Y = chartY(R.alt[i], h);
      if (started2) x.lineTo(X, Y); else { x.moveTo(X, Y); started2 = true; }
    }
    x.stroke();
  };
  line(endT, css('--line'));
  line(now, FLOWN);
  const s = sampleAt(now), X = chartX(now, w), Y = chartY(s.alt, h);
  x.fillStyle = css('--panel'); x.beginPath(); x.arc(X, Y, 5.5, 0, 7); x.fill();
  x.fillStyle = FLOWN; x.beginPath(); x.arc(X, Y, 4, 0, 7); x.fill();
}

// ---- 傳統地圖
let flatBase = null, flatProj = null;
function buildFlat() {
  const c = $('flat');
  if (!c.getBoundingClientRect().width) { flatBase = null; return; }
  const [, w, h, d] = sizeInset(c);
  flatBase = document.createElement('canvas'); flatBase.width = c.width; flatBase.height = c.height;
  const b = flatBase.getContext('2d');
  b.scale(d, d);
  flatProj = d3.geoEquirectangular().fitSize([w, h], { type: 'Sphere' });
  const p = d3.geoPath(flatProj, b);
  b.fillStyle = '#cbe7ef'; b.fillRect(0, 0, w, h);
  b.beginPath(); p(topojson.feature(topo, topo.objects.land)); b.fillStyle = '#b9c9b4'; b.fill();
  b.beginPath(); p({ type: 'LineString', coordinates: R.lon.map((lon, i) => [lon, R.lat[i]]) });
  b.strokeStyle = FLOWN; b.lineWidth = 2; b.stroke();
}
function drawFlat() {
  if (!flatBase) return;
  const c = $('flat'), x = c.getContext('2d'), d = c.width / c.getBoundingClientRect().width;
  const v = sampleAt(now).v, [X, Y] = flatProj([Math.atan2(v[1], v[0]) / DEG, Math.asin(v[2]) / DEG]);
  x.setTransform(1, 0, 0, 1, 0, 0);
  x.drawImage(flatBase, 0, 0);
  x.fillStyle = '#fff'; x.beginPath(); x.arc(X * d, Y * d, 5.5 * d, 0, 7); x.fill();
  x.fillStyle = FLOWN; x.beginPath(); x.arc(X * d, Y * d, 4 * d, 0, 7); x.fill();
}

// ---- 數據列
const fmt = n => Math.round(n).toLocaleString('en-US');
function clockText(time) {
  const s = Math.floor(time), p = v => String(v).padStart(2, '0');
  return `T+${p(Math.floor(s / 3600))}:${p(Math.floor(s / 60) % 60)}:${p(s % 60)}`;
}
function renderHud() {
  const s = sampleAt(now);
  $('clock').textContent = clockText(now);
  $('alt').textContent = `${s.alt.toFixed(s.alt < 100 ? 1 : 0)} km`;
  $('speed').textContent = `${fmt(s.speed)} km/h`;
  $('dist').textContent = `${fmt(s.dist)} km`;
  let e = D.events[0];
  for (const ev of D.events) if (now >= ev[0]) e = ev;
  $('phase').textContent = e ? pick(e[1]) : '';
  $('scrub').value = now;
  drawChart(); drawFlat();
}
function setTime(time) { now = Math.min(endT, Math.max(0, time)); renderHud(); repaint(); }

// ---- 文字
function applyTexts() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-a]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.a)); });
  $('lang').value = lang;
  const menu = $('flight'), chosen = flightId;
  menu.innerHTML = '';
  for (const f of FLIGHTS) menu.add(new Option(pick(f.name), f.id));
  menu.value = chosen;
  $('back').href = `./?lang=${lang}`;
  $('play').textContent = playing ? t('pause') : now >= endT && started ? t('replay') : t('play');
  if (!D) return;
  document.title = `${pick(D.title)} · ${t('pageTitle')}`;
  $('title').textContent = pick(D.title);
  $('subtitle').textContent = pick(D.subtitle);
  $('note').textContent = pick(D.note);
  const box = $('sources');
  box.textContent = '';
  (D.sources || []).forEach((s, i) => {
    if (i) box.append(' · ');
    const a = document.createElement('a');
    a.href = s.url; a.textContent = s.label; a.target = '_blank'; a.rel = 'noopener';
    box.append(a);
  });
}
$('lang').addEventListener('change', e => {
  lang = e.target.value;
  const url = new URL(location.href);
  url.searchParams.set('lang', lang);
  history.replaceState(null, '', url);
  applyTexts();
  renderHud();
  requestDraw();
});

// ---- 播放：先把整段路線帶到畫面中央，再開始跑
function tick(ts) {
  if (!playing) return;
  now = Math.min(endT, now + (ts - last) / 1000 * +$('rate').value);
  last = ts;
  renderHud(); repaint();
  if (now >= endT) { playing = false; $('play').textContent = t('replay'); return; }
  requestAnimationFrame(tick);
}
function pause() { playing = false; $('play').textContent = t('play'); }
$('play').addEventListener('click', () => {
  if (playing) { pause(); return; }
  playing = true; started = true;
  $('play').textContent = t('pause');
  if (now >= endT) now = 0;
  goRoute(() => { if (playing) { last = performance.now(); requestAnimationFrame(tick); } });
});
$('scrub').addEventListener('input', e => { pause(); setTime(+e.target.value); });
$('toRoute').addEventListener('click', () => goRoute());
$('toNorth').addEventListener('click', () => { pause(); goPole(0); });
$('toSouth').addEventListener('click', () => { pause(); goPole(SOUTH_PITCH); });

const tip = $('tip');
function chartTime(e) {
  const r = $('chart').getBoundingClientRect();
  return Math.min(endT, Math.max(0, (e.clientX - r.left - CH.l) / (r.width - CH.l - CH.r) * endT));
}
function placeTip(e) {
  tip.style.display = 'block';
  const left = e.clientX + 12 + tip.offsetWidth > innerWidth ? e.clientX - 12 - tip.offsetWidth : e.clientX + 12;
  tip.style.left = `${Math.max(4, left)}px`; tip.style.top = `${Math.max(4, e.clientY - 28)}px`;
}
let chartDown = false;
$('chart').addEventListener('pointerdown', e => { chartDown = true; pause(); $('chart').setPointerCapture(e.pointerId); setTime(chartTime(e)); });
$('chart').addEventListener('pointermove', e => {
  const time = chartTime(e);
  if (chartDown) setTime(time);
  tip.textContent = `${clockText(time)} · ${sampleAt(time).alt.toFixed(sampleAt(time).alt < 100 ? 1 : 0)} km`;
  placeTip(e);
});
$('chart').addEventListener('pointerup', () => { chartDown = false; });
$('chart').addEventListener('pointerleave', () => { tip.style.display = 'none'; });

// ---- 拖曳：只轉經度和南北，中央垂線不動；Shift 或右鍵才平移。播放中拖曳會先暫停
const pointers = new Map();
let drag = null, pinch = 0;
const zoomAround = (f, sy) => {
  const r = canvas.getBoundingClientRect(), dy = sy - r.top - r.height / 2;
  const next = Math.min(20000, Math.max(40, state.scale * f));
  state.cy -= dy / state.scale - dy / next; state.scale = next; touched();
};
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  canvas.classList.add('dragging');
  tip.style.display = 'none';
  flyId++; pinch = 0; pause();
  drag = pointers.size === 1 ? { x: e.clientX, y: e.clientY, pan: e.shiftKey || e.button === 2 } : null;
});
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) { if (e.pointerType === 'mouse') mapTip(e); return; }
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch) zoomAround(d / pinch, (a[1] + b[1]) / 2);
    pinch = d;
    return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (drag.pan) { state.cx -= dx / state.scale; state.cy += dy / state.scale; }
  else {
    const k = 90 / state.scale;
    state.yaw = (state.yaw - dx * k + 540) % 360 - 180;
    state.pitch = Math.max(0, Math.min(SOUTH_PITCH, state.pitch - dy * k));
    updateMatrix(); rebuildRoute();
  }
  touched();
});
const endPointer = e => { pointers.delete(e.pointerId); pinch = 0; drag = null; if (!pointers.size) canvas.classList.remove('dragging'); };
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') tip.style.display = 'none'; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => { e.preventDefault(); zoomAround(Math.exp(-e.deltaY * .0015), e.clientY); }, { passive: false });
addEventListener('resize', () => { resize(); readBg(); buildFlat(); requestDraw(); renderHud(); });

// 滑過地圖顯示國名和經緯度
function mapTip(e) {
  if (!ids32) return;
  const r = canvas.getBoundingClientRect(), g = [0, 0, 0];
  planeToGeo(state.cx + (e.clientX - r.left - r.width / 2) / state.scale, state.cy - (e.clientY - r.top - r.height / 2) / state.scale, g);
  const lon = Math.atan2(g[1], g[0]) / DEG, lat = Math.asin(Math.max(-1, Math.min(1, g[2]))) / DEG;
  const px = ids32[Math.min(IH - 1, ((0.5 - lat / 180) * IH) | 0) * IW + Math.min(IW - 1, ((lon / 360 + 0.5) * IW) | 0)];
  const n = (px & 255) + (((px >> 8) & 255) << 8);
  const f = px >>> 24 === 255 && n > 0 && n <= features.length ? features[n - 1] : null;
  tip.textContent = `${f ? f.properties.name : t('ocean')} · ${Math.abs(lat).toFixed(1)}°${lat >= 0 ? 'N' : 'S'} ${Math.abs(lon).toFixed(1)}°${lon >= 0 ? 'E' : 'W'}`;
  placeTip(e);
}

// ---- 啟動：打開時和世界地圖一樣，北極在上方正中
applyTexts();
resize(); readBg(); state.folds = true; updateMatrix();
Object.assign(state, fitWholeMap());
// 每段飛行約一分鐘播完：挑最接近的倍速
function setDefaultRate() {
  const want = endT / 60, opts = [...$('rate').options].map(o => +o.value);
  $('rate').value = opts.reduce((best, x) => (Math.abs(Math.log(x / want)) < Math.abs(Math.log(best / want)) ? x : best));
}
function useFlight(flight, time) {
  D = flight; R = D.rows;
  vectors = R.lat.map((lat, i) => fromLonLat(R.lon[i], lat));
  endT = R.t[R.t.length - 1];
  const top = Math.max(...R.alt), step = niceStep(top, 4);
  altMax = Math.ceil(top * 1.02 / step) * step;
  $('scrub').max = endT;
  now = Math.min(endT, Math.max(0, time));
  started = false;
  setDefaultRate();
  rebuildRoute();
  applyTexts();
  buildFlat();
  renderHud();
}
const fetchFlight = id => fetch(`flights/${id}.json`).then(r => { if (!r.ok) throw new Error(`flights/${id}.json: ${r.status}`); return r.json(); });
$('flight').addEventListener('change', e => {
  const id = e.target.value, url = new URL(location.href);
  pause(); flyId++;
  flightId = id;
  url.searchParams.set('flight', id); url.searchParams.delete('t');
  history.replaceState(null, '', url);
  fetchFlight(id).then(f => { if (id !== flightId) return; useFlight(f, 0); goRoute(); })
    .catch(err => { $('phase').textContent = `${t('fail')}: ${err.message}`; console.error(err); });
});
Promise.all([
  fetchFlight(flightId),
  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json', { integrity: 'sha384-Aw4s9pX1PTPntIYkZ/qV9IYiF5Gv8eTl6Dd/TT56zfO1Wwd+owFwYUuuXNUMrWkc', mode: 'cors', credentials: 'omit', referrerPolicy: 'no-referrer' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
]).then(([flight, data]) => {
  topo = data;
  features = topojson.feature(topo, topo.objects.countries).features;
  assignColors(); buildTexture(); buildIdTexture();
  useFlight(flight, +params.get('t') || 0);
  // 面板填入文字後高度會變，要重新對齊
  Object.assign(state, fitWholeMap());
  requestDraw();
}).catch(err => { $('phase').textContent = `${t('fail')}: ${err.message}`; console.error(err); });
</script>
</body>
