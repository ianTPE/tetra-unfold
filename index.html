<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Tetrahedral World Map · 四面體世界地圖</title>
<style>
  :root {
    --bg: #cfe9f0;
    --panel: rgba(255, 255, 255, 0.92);
    --text: #1d3340;
    --muted: #5b7380;
    --line: #d3e2e8;
    --accent: #1f8fbf;
    --accent-text: #ffffff;
    --shadow: 0 4px 18px rgba(20, 60, 80, 0.15);
    --route: #d9381e;
    /* 讓下拉選單、捲軸、滑桿等瀏覽器自己畫的元件也跟著換深淺色 */
    color-scheme: light dark;
  }
  :root[data-theme="light"] { color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1a20;
      --panel: rgba(18, 30, 38, 0.92);
      --text: #e3eef2;
      --muted: #96aeb9;
      --line: #2c4250;
      --accent: #5cc0e8;
      --accent-text: #08202b;
      --shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
      --route: #ff6b4a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1a20;
    --panel: rgba(18, 30, 38, 0.92);
    --text: #e3eef2;
    --muted: #96aeb9;
    --line: #2c4250;
    --accent: #5cc0e8;
    --accent-text: #08202b;
    --shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
    --route: #ff6b4a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
  }
  /* 中日韓的漢字字形各有標準，依語言選字型 */
  :root[lang="zh-Hans"] body { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; }
  :root[lang="ja"] body { font-family: system-ui, -apple-system, "Segoe UI", "Yu Gothic UI", "Hiragino Sans", "Meiryo", sans-serif; }
  :root[lang="ko"] body { font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  #map {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; cursor: grab; touch-action: none;
  }
  #map.dragging { cursor: grabbing; }
  .panel {
    position: fixed; top: 16px; left: 16px;
    width: min(300px, calc(100vw - 32px));
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow);
    padding: 14px 16px; backdrop-filter: blur(6px);
    max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow-y: auto;
  }
  .panel details + details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .panel h1 { font-size: 17px; margin: 0; letter-spacing: 0.02em; }
  .panel .sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 10px; }
  .panel details > summary {
    cursor: pointer; color: var(--muted); font-size: 12.5px; list-style: none; user-select: none;
  }
  .panel details > summary::before { content: "▸ "; }
  .panel details[open] > summary::before { content: "▾ "; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0; }
  .row label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
  input[type="range"] { accent-color: var(--accent); flex: 1; min-width: 0; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button {
    border: 0; background: transparent; color: var(--text);
    padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .seg button.on { background: var(--accent); color: var(--accent-text); }
  .btns { display: flex; gap: 6px; margin-top: 10px; }
  .btns button {
    flex: 1; border: 1px solid var(--line); background: transparent; color: var(--text);
    border-radius: 8px; padding: 6px 0; font: inherit; font-size: 13px; cursor: pointer;
  }
  .btns button:hover, .seg button:not(.on):hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .search { display: flex; gap: 6px; margin-top: 8px; }
  .search input {
    flex: 1; min-width: 0; border: 1px solid var(--line); background: transparent; color: var(--text);
    border-radius: 8px; padding: 5px 8px; font: inherit; font-size: 13px;
  }
  #lang {
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 8px; padding: 3px 6px; font: inherit; font-size: 13px;
  }
  .search button {
    border: 1px solid var(--line); background: transparent; color: var(--text);
    border-radius: 8px; padding: 0 10px; font: inherit; font-size: 13px; cursor: pointer;
  }
  #stops { list-style: none; margin: 8px 0 0; padding: 0; }
  #stops li { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  #stops .num {
    flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--route); color: #fff;
    font-size: 11.5px; display: flex; align-items: center; justify-content: center;
  }
  #stops .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #stops .leg { color: var(--muted); font-size: 12px; white-space: nowrap; }
  #stops button { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 0 2px; font: inherit; }
  #stops button:hover:not(:disabled) { color: var(--text); }
  #stops button:disabled { opacity: 0.3; cursor: default; }
  #tripSummary { font-size: 13px; margin-top: 8px; }
  #tripSummary b { font-size: 15px; }
  #tripSummary .note { color: var(--muted); font-size: 12px; }
  .row > span, .seg button { white-space: nowrap; }
  .row input[type="number"] {
    width: 0; flex: 1; min-width: 60px; border: 1px solid var(--line); background: transparent; color: var(--text);
    border-radius: 8px; padding: 4px 8px; font: inherit; font-size: 13px;
  }
  #rgSummary { font-size: 13px; margin-top: 8px; }
  #rgSummary .note { color: var(--muted); font-size: 12px; }
  #rgList { list-style: none; margin: 6px 0 0; padding: 0; max-height: 180px; overflow-y: auto; }
  #rgList li { display: flex; justify-content: space-between; gap: 8px; padding: 2px 6px 2px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  #rgList li span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #rgList li span:last-child { color: var(--muted); white-space: nowrap; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  .hint p { margin: 2px 0; }
  #tip {
    position: fixed; pointer-events: none; display: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: var(--shadow); padding: 4px 8px; font-size: 12.5px; white-space: nowrap;
  }
  #tip b { display: block; font-size: 13px; }
  #tip span { color: var(--muted); }
  /* 手指點出來的資訊卡：可以按裡面的按鈕，太長時換行 */
  #tip.tap { pointer-events: auto; white-space: normal; max-width: calc(100vw - 16px); }
  #tip button {
    display: block; width: 100%; margin-top: 6px; padding: 8px 12px; border: 0; border-radius: 8px;
    background: var(--accent); color: var(--accent-text); font: inherit; font-size: 14px; cursor: pointer;
  }
  #status {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 15px; pointer-events: none; padding: 16px; text-align: center;
  }
  /* 手機：面板收成一條（直拿在下方，橫拿在左上），點一下或往上滑就展開；地圖只占其餘的空間 */
  #sheetHandle { display: none; }
  @media (max-width: 700px) and (orientation: portrait), (max-height: 500px) and (orientation: landscape) {
    #sheetHandle {
      display: flex; align-items: center; gap: 8px; position: sticky; top: 0; z-index: 1;
      width: calc(100% + 32px); height: 47px; margin: 0 -16px 8px; padding: 0 16px;
      border: 0; border-bottom: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(6px);
      color: var(--text); font: inherit; font-size: 13.5px; cursor: pointer; touch-action: none;
    }
    #sheetInfo { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
    #sheetHandle::after { content: "▴"; color: var(--muted); }
    body.sheet-open #sheetHandle::after { content: "▾"; }
    .panel { display: flex; flex-direction: column; padding-top: 0; max-height: none; overscroll-behavior: contain; }
    .panel > * { flex: none; }
    /* 空間有限：不放標題，語言和分享排到最後，展開就看得到行程 */
    .panel h1, .panel .sub { display: none; }
    .panel > .row, .panel > .btns { order: 1; }
    body:not(.sheet-open) .panel { padding-bottom: 0; overflow: hidden; }
    body:not(.sheet-open) .panel > :not(#sheetHandle) { display: none; }
    body:not(.sheet-open) #sheetHandle { margin-bottom: 0; border-bottom: 0; }
    /* 手指比滑鼠粗，按鈕都放大。輸入框至少 16px，iPhone 點進去才不會自動放大畫面 */
    .row { margin: 12px 0; }
    .panel details > summary { padding: 8px 0; font-size: 14px; }
    input[type="checkbox"] { width: 20px; height: 20px; }
    .btns button { padding: 10px 0; }
    .seg button { padding: 8px 12px; }
    .search button { padding: 0 14px; }
    .search input, #rgValue { padding: 9px 10px; font-size: 16px; }
    #lang { padding: 6px 8px; font-size: 16px; }
    #stops button { padding: 6px 8px; font-size: 16px; }
  }
  @media (max-width: 700px) and (orientation: portrait) {
    .panel { top: auto; left: 0; right: 0; bottom: 0; width: 100%; height: 48px; border-width: 1px 0 0; border-radius: 12px 12px 0 0; }
    body.sheet-open .panel { height: 50vh; height: 50dvh; }
    #map { height: calc(100vh - 48px); height: calc(100dvh - 48px); }
    body.sheet-open #map { height: 50vh; height: 50dvh; }
  }
  @media (max-height: 500px) and (orientation: landscape) {
    .panel { top: 8px; left: 8px; width: 240px; height: 48px; }
    body.sheet-open .panel { top: 0; left: 0; bottom: 0; width: 300px; height: auto; border-width: 0 1px 0 0; border-radius: 0 12px 12px 0; }
    body.sheet-open #map { left: 300px; width: calc(100% - 300px); }
  }
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="status" data-i18n="loading"></div>
<div id="tip"></div>

<div class="panel">
  <button id="sheetHandle" type="button" aria-expanded="false"><span id="sheetInfo" data-i18n="sheetTitle"></span></button>
  <h1 data-i18n="title"></h1>
  <div class="sub" data-i18n="sub"></div>
  <div class="row"><span data-i18n="language"></span><select id="lang"></select></div>
  <div class="btns"><button id="share" data-i18n="share"></button></div>
  <details open>
    <summary data-i18n="settings"></summary>
    <div class="row"><label><input type="checkbox" id="tiled" checked> <span data-i18n="tiled"></span></label></div>
    <div class="row"><label><input type="checkbox" id="equal"> <span data-i18n="equal"></span></label></div>
    <div class="row"><label><input type="checkbox" id="folds"> <span data-i18n="folds"></span></label></div>
    <div class="row"><label><input type="checkbox" id="grat" checked> <span data-i18n="grat"></span></label></div>
    <div class="row"><label><input type="checkbox" id="limit" checked> <span data-i18n="limit"></span></label></div>
    <div class="row">
      <span data-i18n="roll"></span>
      <input type="range" id="roll" min="-180" max="180" step="1" value="0">
    </div>
    <div class="row">
      <span data-i18n="drag"></span>
      <div class="seg" id="mode">
        <button data-mode="rotate" class="on" data-i18n="rotate"></button>
        <button data-mode="pan" data-i18n="pan"></button>
      </div>
    </div>
    <div class="btns">
      <button id="zoomIn" data-i18n-aria="zoomIn">＋</button>
      <button id="zoomOut" data-i18n-aria="zoomOut">－</button>
      <button id="reset" data-i18n="reset"></button>
    </div>
    <div class="btns">
      <button id="toNorth" data-i18n="toNorth"></button>
      <button id="toSouth" data-i18n="toSouth"></button>
    </div>
    <div class="hint">
      <p data-i18n="hintDrag" data-i18n-touch="hintDragTouch"></p>
      <p data-i18n="hintUpDown"></p>
      <p data-i18n="hintWheel" data-i18n-touch="hintWheelTouch"></p>
    </div>
  </details>
  <details open>
    <summary data-i18n="trip"></summary>
    <div class="search">
      <input type="text" id="apSearch" list="apList" data-i18n-placeholder="search" autocomplete="off">
      <button id="apAdd" data-i18n="add"></button>
    </div>
    <datalist id="apList"></datalist>
    <ol id="stops"></ol>
    <div class="row"><label><input type="checkbox" id="roundTrip" checked> <span data-i18n="roundTrip"></span></label></div>
    <div class="btns">
      <button id="optimize" data-i18n="optimize"></button>
      <button id="clearTrip" data-i18n="clear"></button>
    </div>
    <div class="btns"><button id="fitRoute" data-i18n="fitRoute"></button></div>
    <div id="tripSummary"></div>
    <div class="hint">
      <p data-i18n="hintClick" data-i18n-touch="hintClickTouch"></p>
      <p data-i18n="hintOptimize"></p>
      <p data-i18n="approxNote"></p>
      <p data-i18n="hintDistance"></p>
    </div>
  </details>
  <details open>
    <summary data-i18n="range"></summary>
    <div class="search">
      <input type="text" id="rgSearch" list="apList" data-i18n-placeholder="rangeSearch" autocomplete="off">
      <button id="rgSet" data-i18n="rangeSet"></button>
    </div>
    <div class="row">
      <span data-i18n="radius"></span>
      <input type="number" id="rgValue" min="1" step="any" value="5000">
      <div class="seg" id="rgUnit">
        <button data-unit="km" class="on" data-i18n="unitKm"></button>
        <button data-unit="h" data-i18n="unitHours"></button>
      </div>
    </div>
    <div class="btns">
      <button id="rgFromTrip" data-i18n="rangeFromTrip"></button>
      <button id="rgClear" data-i18n="clear"></button>
    </div>
    <div id="rgSummary"></div>
    <ul id="rgList"></ul>
    <div class="hint">
      <p data-i18n="hintRange"></p>
      <p data-i18n="hintHours"></p>
    </div>
  </details>
</div>

<!-- integrity：CDN 上的檔案被改過就不執行。換版本時要重算雜湊 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js" integrity="sha384-9dCJK6nh7skY14HrcvlLYlFga9/MehJjL9ONWRflmiXNRuf8p2jiF4Y5PR881PTq" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="i18n.js"></script>
<script src="trip-order.js"></script>
<script src="tetra-map.js"></script>
<script>
// ---------------------------------------------------------------------------
// 語言（翻譯表在 i18n.js）
// ---------------------------------------------------------------------------
let lang = pickLang();
const t = (key, vars = {}) => (STRINGS[lang][key] ?? STRINGS.en[key] ?? key).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
const locale = () => (lang === 'zh-Hant' ? 'zh-TW' : lang === 'zh-Hans' ? 'zh-CN' : lang);
let regionNames = null, kmFormat = null;
function setupLocale() {
  try { regionNames = new Intl.DisplayNames([locale(), lang], { type: 'region' }); } catch (e) { regionNames = null; }
  try {
    kmFormat = new Intl.NumberFormat(locale(), { style: 'unit', unit: 'kilometer', unitDisplay: 'short', maximumFractionDigits: 0 });
  } catch (e) {
    kmFormat = { format: n => Math.round(n).toLocaleString() + ' km' };
  }
}
// 國名用瀏覽器內建的翻譯；沒有的話用 fallback（英文）
function regionName(code, fallback) {
  try {
    const n = regionNames && code && regionNames.of(code);
    // 繁體中文依教育部用字寫「臺灣」，和「臺灣桃園國際機場」一致
    if (n && n !== code) return lang === 'zh-Hant' ? n.replace(/台灣/g, '臺灣') : n;
  } catch (e) { /* 用 fallback */ }
  return fallback || code || '';
}
// 觸控裝置沒有滾輪和滑鼠指標，說明文字換成手指的操作
const isTouch = matchMedia('(pointer: coarse)').matches;
function applyTexts() {
  document.documentElement.lang = lang;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(isTouch && el.dataset.i18nTouch || el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
}
function setLang(l) {
  lang = l;
  setupLocale();
  applyTexts();
  try { localStorage.setItem('tetra-unfold-lang', l); } catch (e) { /* 不能存就算了 */ }
  const url = new URL(location.href);
  url.searchParams.set('lang', l);
  history.replaceState(null, '', url);
  localizeAirports();
}
const langSelect = document.getElementById('lang');
langSelect.innerHTML = Object.entries(LANGS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
langSelect.value = lang;
langSelect.addEventListener('change', () => setLang(langSelect.value));
setupLocale();
applyTexts();

// 拖曳中先用低解析度畫，停下來再畫完整的
let pending = false, interacting = false, settleTimer = 0;
let urlReady = false, syncTimer = 0;   // 分享網址（見下面「分享」一節）
function requestDraw() {
  scheduleSync();
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => {
    pending = false;
    draw(interacting ? 0.4 : 1);
  });
}
function touch() {
  interacting = true;
  clearTimeout(settleTimer);
  settleTimer = setTimeout(() => { interacting = false; requestDraw(); }, 160);
  requestDraw();
}

// ---------------------------------------------------------------------------
// 互動
// ---------------------------------------------------------------------------
const tip = document.getElementById('tip');
let drag = null;

function screenToPlane(cx, cy) {
  const r = canvas.getBoundingClientRect();
  return [state.cx + (cx - r.left - r.width / 2) / state.scale,
          state.cy - (cy - r.top - r.height / 2) / state.scale];
}

function placeTip(e) {
  tip.style.display = 'block';
  const tw = tip.offsetWidth, th = tip.offsetHeight, bottom = canvas.getBoundingClientRect().bottom;
  const left = e.clientX + 14 + tw > window.innerWidth ? e.clientX - 14 - tw : e.clientX + 14;
  const top = e.clientY + 14 + th > bottom ? e.clientY - 14 - th : e.clientY + 14;
  tip.style.left = Math.max(8, left) + 'px';
  tip.style.top = Math.max(8, top) + 'px';
}

function showTip(e) {
  // 手指點出來的提示卡，機場要多一顆加入行程的按鈕，可點的範圍也放大
  const finger = e.pointerType !== 'mouse';
  tip.classList.toggle('tap', finger);
  const ap = pickAirport(e.clientX, e.clientY, finger ? 22 : 12);
  if (ap >= 0) {
    const a = airports[ap];
    tip.innerHTML = `<b>${a.iata}　${esc(apName(a))}</b>` +
      (apName(a) !== a.name ? `<span>${esc(a.name)}</span><br>` : '') +
      `<span>${esc(placeOf(a))}${finger ? '' : '　·　' + esc(t('clickToAdd'))}</span>` + rangeTip(a.v) +
      (finger ? `<button data-ap="${ap}">${esc(t('addToTrip'))}</button>` : '');
    canvas.style.cursor = 'pointer';
    placeTip(e);
    return;
  }
  canvas.style.cursor = '';
  if (!ids32) return;
  const [x, y] = screenToPlane(e.clientX, e.clientY);
  const inMain = x >= 0 && x < MAP_W && y >= 0 && y < MAP_H;
  if (!state.tiled && !inMain) { tip.style.display = 'none'; return; }
  const g = [0, 0, 0];
  planeToGeo(x, y, g);
  const lon = Math.atan2(g[1], g[0]) / DEG, lat = Math.asin(Math.max(-1, Math.min(1, g[2]))) / DEG;
  const u = Math.min(IW - 1, ((lon / 360 + 0.5) * IW) | 0);
  const v = Math.min(IH - 1, ((0.5 - lat / 180) * IH) | 0);
  const px = ids32[v * IW + u];
  const alpha = px >>> 24, n = (px & 255) + (((px >> 8) & 255) << 8);
  const f = alpha === 255 && n > 0 && n <= features.length ? features[n - 1] : null;
  const coord = `${Math.abs(lat).toFixed(1)}°${lat >= 0 ? 'N' : 'S'}　${Math.abs(lon).toFixed(1)}°${lon >= 0 ? 'E' : 'W'}`;
  tip.innerHTML = `<b>${esc(f ? countryName(f) : t('ocean'))}</b><span>${coord}</span>` + rangeTip(g);
  placeTip(e);
}

// 正按在地圖上的手指。兩指時用它們的距離縮放、中點平移
const pointers = new Map();
let pinch = null;
function pinchState() {
  const [a, b] = pointers.values();
  return { d: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
}

canvas.addEventListener('pointerdown', e => {

    drag = null; canvas.classList.remove('dragging');
    pinch = pinchState();
    return;
  }
  drag = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, moved: false,

canvas.addEventListener('pointermove', e => {

    if (pinch.d > 0 && n.d > 0) zoomAt(n.d / pinch.d, n.x, n.y);
    state.cx -= (n.x - pinch.x) / state.scale;
    state.cy += (n.y - pinch.y) / state.scale;

    // 有限制時：最北到北極對齊上邊中央，最南到南極對齊下邊中央

function zoomAt(factor, clientX, clientY) {

  state.cx += before[0] - after[0];

}

// ---------------------------------------------------------------------------
// 出差路線：機場、大圓航線、距離、最順的順序
// ---------------------------------------------------------------------------
let airports = [], apByCode = {}, apCountriesEn = {};
const namesCache = {};               // 各語言的機場名稱（names/<lang>.json），載入過就留著
let apPlane = null, apPlaneVer = -1; // 每個機場在畫面上的一份位置，方向改變時重算
const trip = { stops: [], legsCache: null, legsVer: -1, note: '', dropped: [] };
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

const angBetween = (a, b) => Math.acos(Math.max(-1, Math.min(1, dot(a, b))));
const legKm = (i, j) => angBetween(airports[i].v, airports[j].v) * EARTH_R;
// 目前語言的機場名稱、城市名稱；沒有翻譯時用英文
const apName = a => a.lname || a.name;
const apCity = a => a.lcity || a.city;
const placeOf = a => [apCity(a), a.country].filter(Boolean).join(t('sep'));
// 滑過的國家：用數字代碼換成兩碼代碼，再交給瀏覽器翻譯
const countryName = f => regionName(COUNTRY_NUM_TO_ALPHA2[String(f.id).padStart(3, '0')] || COUNTRY_NAME_TO_ALPHA2[f.properties.name],
                                    f.properties.name);
const isRound = n => document.getElementById('roundTrip').checked && n > 2;

// 小圓點：大型機場一直顯示；放大後也顯示中型機場
const showMedium = () => state.scale > 1600;
function airportPositions() {
  if (apPlaneVer !== geoVersion) {
    apPlane = airports.map(a => geoToPlane(a.v));
    apPlaneVer = geoVersion;
  }
  return apPlane;
}

// 螢幕上離 (clientX, clientY) 12 像素內最近的機場，沒有就回傳 −1
function pickAirport(clientX, clientY, radius = 12) {
  if (!airports.length) return -1;
  const P = screenToPlane(clientX, clientY);
  if (!state.tiled && !(P[0] >= 0 && P[0] < MAP_W && P[1] >= 0 && P[1] < MAP_H)) return -1;
  const pos = airportPositions(), lim = radius / state.scale, med = showMedium();
  const T = copyTransforms(P[0] - lim, P[0] + lim, P[1] - lim, P[1] + lim);
  const near = [];                   // [機場, 螢幕上的距離（像素）]
  airports.forEach((a, i) => {
    if (!a.large && !med && !trip.stops.includes(i)) return;
    const Q = pos[i];
    let d = Infinity;
    for (const [s, ox, oy] of T) d = Math.min(d, Math.hypot(s * Q[0] + ox - P[0], s * Q[1] + oy - P[1]));
    if (d < lim) near.push([i, d * state.scale]);
  });
  if (!near.length) return -1;
  // 幾個機場疊在一起（差不到 4 像素）時，選旅客最多的
  const d0 = Math.min(...near.map(n => n[1]));
  return near.filter(n => n[1] <= d0 + 4).sort((a, b) => airports[b[0]].pax - airports[a[0]].pax)[0][0];
}

// 一段大圓航線：沿大圓每 1° 取一點，投到畫面上，並讓相鄰的點選同一份拷貝，線才不會跳開
function gcPath(A, B) {
  const ang = angBetween(A, B), sinA = Math.sin(ang);
  if (ang < 1e-9 || sinA < 1e-9) return null;
  const m = Math.max(2, Math.ceil(ang / DEG));
  const pts = [];
  let prev = null;
  for (let i = 0; i <= m; i++) {
    const t = i / m, wa = Math.sin((1 - t) * ang) / sinA, wb = Math.sin(t * ang) / sinA;
    let P = geoToPlane([A[0] * wa + B[0] * wb, A[1] * wa + B[1] * wb, A[2] * wa + B[2] * wb]);
    P = nearestCopy(P, prev || [MAP_W / 2, MAP_H / 2]);
    pts.push(P); prev = P;
  }
  return pts;
}
function tripLegs() {
  if (trip.legsVer === geoVersion && trip.legsCache) return trip.legsCache;
  const st = trip.stops, n = st.length, legs = [];
  const count = isRound(n) ? n : n - 1;
  for (let k = 0; k < count; k++) {
    const pts = gcPath(airports[st[k]].v, airports[st[(k + 1) % n]].v);
    if (pts) legs.push(pts);
  }
  trip.legsCache = legs; trip.legsVer = geoVersion;
  return legs;
}

function drawTrip(x0, x1, y0, y1) {
  if (!airports.length) return;
  ctx.save();
  if (!state.tiled) {
    const a = toScreen(0, MAP_H), b = toScreen(MAP_W, 0);
    ctx.beginPath(); ctx.rect(a[0], a[1], b[0] - a[0], b[1] - a[1]); ctx.clip();
  }
  const T = copyTransforms(x0, x1, y0, y1);
  const inView = (X, Y, m) => X > x0 - m && X < x1 + m && Y > y0 - m && Y < y1 + m;
  const pos = airportPositions(), med = showMedium();
  // 機場小圓點
  ctx.fillStyle = 'rgba(30, 45, 60, 0.55)';
  ctx.beginPath();
  // 手機螢幕小、整張地圖縮得小，圓點也跟著縮，才不會蓋滿大陸
  const r = (med ? 2.6 : Math.max(1, Math.min(2, state.scale / 300))) * dpr;
  airports.forEach((a, i) => {
    if (!a.large && !med) return;
    const Q = pos[i];
    for (const [s, ox, oy] of T) {
      const X = s * Q[0] + ox, Y = s * Q[1] + oy;
      if (!inView(X, Y, 0)) continue;
      const p = toScreen(X, Y);
      ctx.moveTo(p[0] + r, p[1]); ctx.arc(p[0], p[1], r, 0, 2 * Math.PI);
    }
  });
  ctx.fill();
  // 航線：先畫白色外框，再畫顏色
  const route = getComputedStyle(document.documentElement).getPropertyValue('--route').trim() || '#d9381e';
  const legs = tripLegs();
  for (const [lw, color] of [[6, 'rgba(255, 255, 255, 0.85)'], [2.6, route]]) {
    ctx.strokeStyle = color; ctx.lineWidth = lw * dpr; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    strokePaths(legs, T, x0, x1, y0, y1);
    ctx.stroke();
  }
  // 各站編號（同一個機場出現多次時，標第一次的編號）
  ctx.font = `bold ${11 * dpr}px system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const seen = new Set();
  trip.stops.forEach((ap, k) => {
    if (seen.has(ap)) return;
    seen.add(ap);
    const Q = pos[ap];
    for (const [s, ox, oy] of T) {
      const X = s * Q[0] + ox, Y = s * Q[1] + oy;
      if (!inView(X, Y, 0.05)) continue;
      const p = toScreen(X, Y);
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p[0], p[1], 10.5 * dpr, 0, 2 * Math.PI); ctx.fill();
      ctx.fillStyle = route; ctx.beginPath(); ctx.arc(p[0], p[1], 9 * dpr, 0, 2 * Math.PI); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillText(String(k + 1), p[0], p[1] + 0.5 * dpr);
    }
  });
  ctx.restore();
}

function tripChanged(note = '') {
  trip.legsCache = null; trip.note = note;
  renderTrip();
  requestDraw();
}
function addStop(i) {
  const st = trip.stops;
  if (st.length && st[st.length - 1] === i) return;
  if (st.length >= MAX_STOPS) { tripChanged(t('maxStops', { n: MAX_STOPS })); return; }
  st.push(i);
  tripChanged();
}
// 把路線轉到畫面中央 ----------------------------------------------------------
// 整趟路線沿著走一遍（前一點接下一點，不跳到別的拼接拷貝）在平面上的點
function routePoints() {
  const st = trip.stops, n = st.length, count = isRound(n) ? n : n - 1, pts = [];
  let prev = [MAP_W / 2, MAP_H / 2];
  const add = g => { prev = nearestCopy(geoToPlane(g), prev); pts.push(prev); };
  add(airports[st[0]].v);
  for (let k = 0; k < count; k++) {
    const A = airports[st[k]].v, B = airports[st[(k + 1) % n]].v;
    const ang = angBetween(A, B), sinA = Math.sin(ang);
    if (sinA < 1e-9) continue;
    const m = Math.ceil(ang / (6 * DEG));
    for (let i = 1; i <= m; i++) {
      const wa = Math.sin((1 - i / m) * ang) / sinA, wb = Math.sin(i / m * ang) / sinA;
      add([A[0] * wa + B[0] * wb, A[1] * wa + B[1] * wb, A[2] * wa + B[2] * wb]);
    }
  }
  return pts;
}
// 路線離地圖中心多遠，1 是碰到長方形的邊。小於 1 表示整趟都在一份地圖裡，不會被邊界切開
function routeSpread() {
  let spread = 0;
  for (const [x, y] of routePoints()) {
    spread = Math.max(spread, Math.abs(x - MAP_W / 2) / (MAP_W / 2), Math.abs(y - MAP_H / 2) / (MAP_H / 2));
  }
  return spread;
}
// 路線是不是整趟都看得到（電腦版左邊有面板蓋著，不算看得到）
function routeInView() {
  const w = canvas.clientWidth, h = canvas.clientHeight, S = state.scale, m = 0.03;
  const covered = sheetMQ.matches ? 0 : document.querySelector('.panel').getBoundingClientRect().right;
  const x0 = state.cx + (covered - w / 2) / S, x1 = state.cx + w / 2 / S;
  const y0 = state.cy - h / 2 / S, y1 = state.cy + h / 2 / S;
  return routePoints().every(([x, y]) => x > x0 + m && x < x1 - m && y > y0 + m && y < y1 - m);
}
// 找讓路線最集中的轉法：只左右轉和上下轉（北方維持朝上），先粗略掃過，再在最好的附近細找
function bestRouteView() {
  const saved = [state.yaw, state.pitch, state.roll];
  const score = (yaw, pitch) => { state.yaw = yaw; state.pitch = pitch; updateMatrix(); return routeSpread(); };
  state.roll = 0;
  let best = { yaw: saved[0], pitch: saved[1], spread: saved[2] ? Infinity : score(saved[0], saved[1]) };
  const current = best.spread;
  const consider = (yaw, pitch) => {
    pitch = Math.max(0, Math.min(SOUTH_PITCH, pitch));
    const spread = score(yaw, pitch);
    if (spread < best.spread) best = { yaw, pitch, spread };
  };
  for (let yaw = -180; yaw < 180; yaw += 15) {
    for (let k = 0; k <= 4; k++) consider(yaw, SOUTH_PITCH * k / 4);
  }
  for (const step of [6, 3]) {
    const { yaw, pitch } = best;
    for (const dy of [-step, 0, step]) for (const dp of [-step, 0, step]) {
      if (dy || dp) consider((yaw + dy + 540) % 360 - 180, pitch + dp);
    }
  }
  [state.yaw, state.pitch, state.roll] = saved;
  updateMatrix();
  // 差不多的話就不要轉，免得地圖白白動一下
  if (current - best.spread < 0.02) return { yaw: saved[0], pitch: saved[1], roll: saved[2] };
  return { yaw: best.yaw, pitch: best.pitch, roll: 0 };
}
// 平順地轉過去；碰一下地圖就停
let flyId = 0;
function flyTo(view, ms) {
  const id = ++flyId, start = performance.now();
  const from = { yaw: state.yaw, pitch: state.pitch, roll: state.roll, scale: state.scale, cx: state.cx, cy: state.cy };
  const dYaw = ((view.yaw - from.yaw + 540) % 360 + 360) % 360 - 180;
  const step = now => {
    if (id !== flyId) return;
    const u = ms > 0 ? Math.min(1, (now - start) / ms) : 1, e = u * u * (3 - 2 * u);
    state.yaw = (from.yaw + dYaw * e + 540) % 360 - 180;
    state.pitch = from.pitch + (view.pitch - from.pitch) * e;
    state.roll = from.roll + (view.roll - from.roll) * e;
    state.scale = from.scale + (view.scale - from.scale) * e;
    state.cx = from.cx + (view.cx - from.cx) * e;
    state.cy = from.cy + (view.cy - from.cy) * e;
    if (u === 1) { state.yaw = view.yaw; state.pitch = view.pitch; state.roll = view.roll; }
    rollInput.value = Math.round(state.roll);
    updateMatrix();
    touch();
    if (u < 1) requestAnimationFrame(step);

}
function fitRoute(ms = 450) {

  const view = bestRouteView();
  // 電腦版左邊有面板，地圖放進面板以外的地方
  const covered = sheetMQ.matches ? 0 : document.querySelector('.panel').getBoundingClientRect().right;
  const scale = Math.min((canvas.clientWidth - covered) * 0.9 / MAP_W, canvas.clientHeight * 0.8 / MAP_H);
  Object.assign(view, { scale, cx: MAP_W / 2 - covered / 2 / scale, cy: MAP_H / 2 });
  flyTo(view, ms);
}
// 路線有一部分看不到時才轉。放大了在點機場的話不動，免得要點的下一個機場跑掉
function keepRouteInView(fromMap, ms) {
  if (trip.stops.length < 2) return;
  const kept = [state.scale, state.cx, state.cy];
  fitView();
  const fitScale = state.scale;
  [state.scale, state.cx, state.cy] = kept;
  if (fromMap && state.scale > fitScale * 1.05) return;
  if (!routeInView()) fitRoute(ms);
}
document.getElementById('fitRoute').onclick = () => fitRoute();

function tripLength(order) {
  let s = 0;
  for (let k = 0; k + 1 < order.length; k++) s += legKm(order[k], order[k + 1]);
  if (isRound(order.length)) s += legKm(order[order.length - 1], order[0]);
  return s;
}
function renderTrip() {
  const st = trip.stops, list = document.getElementById('stops');
  // 手機面板收起時，那一條顯示目前的行程
  document.getElementById('sheetInfo').textContent = st.length
    ? (st.length > 1 ? fmtKm(tripLength(st)) + ' · ' : '') + st.map(ap => airports[ap].iata).join(' → ')
    : t('sheetTitle');
  list.innerHTML = st.map((ap, k) => {
    const a = airports[ap];
    const leg = k ? fmtKm(legKm(st[k - 1], ap)) : esc(t('start'));
    const full = apName(a) !== a.name ? apName(a) + '\n' + a.name : a.name;
    return `<li><span class="num">${k + 1}</span>` +
      `<span class="name" title="${esc(full)}">${a.iata} ${esc(a.lcity || a.lname || a.city || a.name)}</span>` +
      `<span class="leg">${leg}</span>` +
      `<button data-act="up" data-k="${k}" aria-label="${esc(t('moveUp'))}" ${k ? '' : 'disabled'}>↑</button>` +
      `<button data-act="down" data-k="${k}" aria-label="${esc(t('moveDown'))}" ${k < st.length - 1 ? '' : 'disabled'}>↓</button>` +
      `<button data-act="del" data-k="${k}" aria-label="${esc(t('remove'))}">×</button></li>`;
  }).join('');
  const sum = document.getElementById('tripSummary');
  const note = trip.note ? `<span class="note">${trip.note}</span>` : '';
  if (st.length < 2) {
    sum.innerHTML = note || `<span class="note">${esc(t('needTwo'))}</span>`;
    return;
  }
  const last = st[st.length - 1];
  const back = isRound(st.length)
    ? `<br><span class="note">${esc(t('lastLeg', { a: airports[last].iata, b: airports[st[0]].iata, d: fmtKm(legKm(last, st[0])) }))}</span>` : '';
  sum.innerHTML = `${esc(t('total'))} <b>${fmtKm(tripLength(st))}</b>${back}` + (note ? '<br>' + note : '');
}
document.getElementById('stops').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  const k = +b.dataset.k, st = trip.stops;
  if (b.dataset.act === 'del') st.splice(k, 1);
  else if (b.dataset.act === 'up') [st[k - 1], st[k]] = [st[k], st[k - 1]];
  else if (b.dataset.act === 'down') [st[k + 1], st[k]] = [st[k], st[k + 1]];
  tripChanged();
});
document.getElementById('roundTrip').addEventListener('change', () => tripChanged());
document.getElementById('clearTrip').onclick = () => { trip.stops = []; tripChanged(); };

document.getElementById('optimize').onclick = () => {
  const st = trip.stops;
  if (st.length < 3) { tripChanged(esc(t('needThree'))); return; }
  const exact = st.length <= EXACT_STOPS;
  const d = st.map(a => st.map(b => legKm(a, b)));
  const order = bestOrder(d, isRound(st.length));
  const after = order.map(k => st[k]);
  const saved = tripLength(st) - tripLength(after);
  if (saved > 1e-9) trip.stops = after;
  const result = saved > 0.5 ? t('reordered', { d: fmtKm(saved) }) : exact ? t('alreadyBest') : t('approxNone');
  tripChanged(esc(exact ? result : result + ' ' + t('approxNote')));
  keepRouteInView(false);
};

// 搜尋用的正規化：不分大小寫，「台」「臺」視為相同
const normText = t => String(t).toLowerCase().replace(/台/g, '臺');
function findAirport(text) {
  const t = text.trim();
  if (!t) return -1;
  const code = t.slice(0, 3).toUpperCase();
  // 「LAX 洛杉磯」是下拉選單的格式。前三碼要大寫才算代碼，不然 Los Angeles 會被當成 LOS（拉哥斯）
  if (code in apByCode && (t.length === 3 || (t[3] === ' ' && t.startsWith(code)))) return apByCode[code];
  const q = normText(t);
  // 先找城市名完全相同的，再找名稱裡有這幾個字的（清單已經把大型機場排在前面）
  // 依序找：城市名完全相同 → 國家名完全相同 → 名稱裡有這幾個字。同樣符合時，旅客最多的排在前面
  let i = airports.findIndex(a => a.keys.cities.includes(q));
  if (i < 0) i = airports.findIndex(a => a.keys.countries.includes(q));
  if (i < 0) i = airports.findIndex(a => a.keys.all.includes(q));
  return i;
}
function addFromSearch() {
  const input = document.getElementById('apSearch');
  const i = findAirport(input.value);
  if (i < 0) { tripChanged(esc(t('notFound', { q: input.value.trim() }))); return; }
  input.value = '';
  addStop(i);
  keepRouteInView(false);
}
document.getElementById('apAdd').onclick = addFromSearch;
// 中日韓輸入法選字時也會按 Enter，這時不能當成送出。keyCode 229 擋 Safari 選字完才送來的那次 Enter
const isSubmitEnter = e => e.key === 'Enter' && !e.isComposing && e.keyCode !== 229;
document.getElementById('apSearch').addEventListener('keydown', e => { if (isSubmitEnter(e)) addFromSearch(); });

// 依目前語言設定機場的顯示名稱和搜尋關鍵字。名稱檔第一次用到時才下載
const CITY_SUFFIX = /(特別市|広域市|특별시|광역시|市|縣|县|都|府|県|시)$/;
function localizeAirports() {
  if (!airports.length) return;
  const want = lang;
  const apply = names => {
    if (lang !== want) return;
    for (const a of airports) {
      const [n = '', c = '', alt = ''] = names[a.iata] || [];
      a.lname = n; a.lcity = c;
      a.country = regionName(a.cc, apCountriesEn[a.cc]);
      const cityNames = [c, ...(alt ? alt.split('|') : [])].filter(Boolean);
      a.keys = {
        cities: [...cityNames, ...cityNames.map(x => x.replace(CITY_SUFFIX, '')), a.city].filter(Boolean).map(normText),
        countries: [a.country, apCountriesEn[a.cc]].filter(Boolean).map(normText),
        all: normText([n, ...cityNames, a.name, a.city, a.country, apCountriesEn[a.cc]].join('|')),
      };
    }
    document.getElementById('apList').innerHTML = airports.map(a =>
      `<option value="${a.iata} ${esc(apCity(a) || apName(a))}">${esc(apName(a))}${esc(t('sep'))}${esc(a.country)}</option>`).join('');
    // 網址的站數超過上限時，說明哪些站沒有加入（只在剛打開時）
    trip.note = trip.dropped.length ? esc(t('urlDropped', { n: MAX_STOPS, list: trip.dropped.join(', ') })) : '';
    trip.dropped = [];
    renderTrip();
    renderRange();
    fillCenterInputs();
    requestDraw();
  };
  if (namesCache[want]) { apply(namesCache[want]); return; }
  fetch(`names/${want}.json`)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .catch(() => ({}))                // 沒有翻譯檔就全部用英文
    .then(d => { namesCache[want] = d; apply(d); });
}

// 清單已經依「大型機場優先、旅客人數多的優先」排好
fetch('airports.json')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => {
    apCountriesEn = data.countries;
    airports = data.airports.map(([iata, name, city, cc, lat, lon, large, paxM]) =>
      ({ iata, name, city, cc, lat, lon, large: !!large, pax: paxM || 0, v: fromLonLat(lon, lat),
         lname: '', lcity: '', country: data.countries[cc] || cc, keys: { cities: [], countries: [], all: '' } }));
    airports.forEach((a, i) => { apByCode[a.iata] = i; });
    applyDataFromURL();
    localizeAirports();
  })
  .catch(err => { document.getElementById('tripSummary').textContent = t('apFail', { msg: err.message }); });

// ---------------------------------------------------------------------------
// 距離範圍圈：球面上離中心同樣距離的點（小圓）
// ---------------------------------------------------------------------------
const CRUISE_KMH = 800;              // 飛行小時換算距離用的平均速度（粗估）
const MAX_RANGE_KM = Math.PI * EARTH_R;
const range = { ap: -1, v: null, km: 5000, unit: 'km', ptsCache: null, ptsKey: '', note: '' };
const rangeOn = () => range.v !== null;
const rangeAngle = () => Math.min(range.km, MAX_RANGE_KM) / EARTH_R;
const rgValue = document.getElementById('rgValue');

function rangeTip(g) {
  if (!rangeOn()) return '';
  const d = angBetween(range.v, g) * EARTH_R;
  return `<br><span>${esc(t('fromCenter', { c: airports[range.ap].iata, d: fmtKm(d) }))}</span>`;
}

// 圈線：沿小圓取點，相鄰的點選同一份拷貝，線才不會跳開
function rangePoints() {
  const key = `${geoVersion}|${range.ap}|${range.km}`;
  if (range.ptsKey === key) return range.ptsCache;
  const c = range.v, th = rangeAngle();
  // 和中心垂直的兩個方向
  const e1 = norm(Math.abs(c[2]) < 0.9 ? cross(c, [0, 0, 1]) : cross(c, [1, 0, 0])), e2 = cross(c, e1);
  const n = 720, cs = Math.cos(th), sn = Math.sin(th), pts = [];
  let prev = null;
  for (let i = 0; i <= n; i++) {
    const a = i / n * 2 * Math.PI, ca = Math.cos(a) * sn, sa = Math.sin(a) * sn;
    let P = geoToPlane([c[0] * cs + e1[0] * ca + e2[0] * sa, c[1] * cs + e1[1] * ca + e2[1] * sa, c[2] * cs + e1[2] * ca + e2[2] * sa]);
    P = nearestCopy(P, prev || [MAP_W / 2, MAP_H / 2]);
    pts.push(P); prev = P;
  }
  range.ptsCache = pts; range.ptsKey = key;
  return pts;
}

function drawRange(x0, x1, y0, y1) {
  if (!rangeOn() || !airports.length) return;
  ctx.save();
  if (!state.tiled) {
    const a = toScreen(0, MAP_H), b = toScreen(MAP_W, 0);
    ctx.beginPath(); ctx.rect(a[0], a[1], b[0] - a[0], b[1] - a[1]); ctx.clip();
  }
  const T = copyTransforms(x0, x1, y0, y1);
  if (range.km < MAX_RANGE_KM) {
    const pts = rangePoints();
    for (const [lw, color] of [[5, 'rgba(255, 255, 255, 0.8)'], [2, '#7a4fd0']]) {
      ctx.strokeStyle = color; ctx.lineWidth = lw * dpr; ctx.lineJoin = 'round';
      ctx.beginPath();
      strokePaths([pts], T, x0, x1, y0, y1);
      ctx.stroke();
    }
  }
  // 中心：紫色的圈
  const Q = airportPositions()[range.ap];
  for (const [s, ox, oy] of T) {
    const X = s * Q[0] + ox, Y = s * Q[1] + oy;
    if (X < x0 - 0.05 || X > x1 + 0.05 || Y < y0 - 0.05 || Y > y1 + 0.05) continue;
    const p = toScreen(X, Y);
    ctx.lineWidth = 3 * dpr;
    ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.arc(p[0], p[1], 7 * dpr, 0, 2 * Math.PI); ctx.stroke();
    ctx.lineWidth = 2 * dpr;
    ctx.strokeStyle = '#7a4fd0'; ctx.beginPath(); ctx.arc(p[0], p[1], 7 * dpr, 0, 2 * Math.PI); ctx.stroke();
  }
  ctx.restore();
}

// 圈內的城市：只算大型機場，同一個城市只列最近的那個機場。回傳 [機場, 角距離]，由近到遠
const cityOf = a => a.lcity || a.city || apName(a);
function rangeCities() {
  const c = airports[range.ap], th = rangeAngle(), seen = new Set([cityOf(c)]), out = [];
  airports
    .map((a, i) => [i, angBetween(c.v, a.v)])
    .filter(([i, d]) => airports[i].large && d <= th)
    .sort((a, b) => a[1] - b[1])
    .forEach(([i, d]) => {
      const name = cityOf(airports[i]);
      if (seen.has(name)) return;
      seen.add(name);
      out.push([i, d]);
    });
  return out;
}
function renderRange() {
  const sum = document.getElementById('rgSummary'), list = document.getElementById('rgList');
  const note = range.note ? `<span class="note">${range.note}</span>` : '';
  if (!rangeOn()) { sum.innerHTML = note || `<span class="note">${esc(t('rangeNeed'))}</span>`; list.innerHTML = ''; return; }
  const c = airports[range.ap];
  const rows = rangeCities().map(([i, d]) => {
    const a = airports[i];
    return `<li><span>${a.iata} ${esc(cityOf(a))}${esc(t('sep'))}${esc(a.country)}</span><span>${fmtKm(d * EARTH_R)}</span></li>`;
  });
  const radius = range.unit === 'h'
    ? t('hoursKm', { h: +range.value.toFixed(1), d: fmtKm(range.km) }) : fmtKm(range.km);
  sum.innerHTML = esc(t('rangeSummary', { c: `${c.iata} ${cityOf(c)}`, r: radius, n: rows.length })) + (note ? '<br>' + note : '');
  list.innerHTML = rows.join('');
}

function rangeChanged(note = '') {
  range.note = note;
  renderRange();
  requestDraw();
}
function readRadius() {
  const v = parseFloat(rgValue.value);
  if (!(v > 0)) return false;
  range.value = v;
  range.km = Math.min(MAX_RANGE_KM, range.unit === 'h' ? v * CRUISE_KMH : v);
  return true;
}
function setRangeCenter(i) {
  range.ap = i; range.v = airports[i].v;
  readRadius();
  fillCenterInputs();
  rangeChanged();
}
// 範圍圈的中心只有一個：輸入格裡顯示目前設定的那一個（例如「TPE 桃園」），清除時才清空
const apLabel = i => i < 0 ? '' : `${airports[i].iata} ${cityOf(airports[i])}`;
function fillCenterInputs() {
  document.getElementById('rgSearch').value = rangeOn() ? apLabel(range.ap) : '';
}
function setRangeFromSearch() {
  const input = document.getElementById('rgSearch');
  const i = findAirport(input.value);
  if (i < 0) { rangeChanged(esc(t('notFound', { q: input.value.trim() }))); return; }
  setRangeCenter(i);
}
document.getElementById('rgSet').onclick = setRangeFromSearch;
document.getElementById('rgSearch').addEventListener('keydown', e => { if (isSubmitEnter(e)) setRangeFromSearch(); });
document.getElementById('rgFromTrip').onclick = () => {
  if (!trip.stops.length) { rangeChanged(esc(t('rangeNoTrip'))); return; }
  setRangeCenter(trip.stops[0]);
};
document.getElementById('rgClear').onclick = () => { range.ap = -1; range.v = null; fillCenterInputs(); rangeChanged(); };
rgValue.addEventListener('input', () => { if (readRadius() && rangeOn()) rangeChanged(); });
document.getElementById('rgUnit').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.dataset.unit === range.unit) return;
  // 換單位時，把目前的數字換算過去
  const v = parseFloat(rgValue.value);
  if (v > 0) rgValue.value = b.dataset.unit === 'h' ? +(v / CRUISE_KMH).toFixed(1) : Math.round(v * CRUISE_KMH);
  range.unit = b.dataset.unit;
  for (const x of e.currentTarget.children) x.classList.toggle('on', x === b);
  readRadius();
  if (rangeOn()) rangeChanged(); else renderRange();
});
range.value = range.km;
renderRange();

// ---------------------------------------------------------------------------
// 分享：把目前的設定寫進網址，打開網址就還原同樣的畫面
//
//   v=經度,上下,翻轉    地球轉的角度（都是 0 時省略）
//   eq=1 folds=1 grat=0 tiled=0 limit=0   和預設不同的選項
//   trip=TPE,HND,LHR    行程；rt=0 表示不回到出發地
//   range=TPE,5000      範圍圈（公里）；range=TPE,12h 表示飛行小時
// ---------------------------------------------------------------------------
const TOGGLES = { equal: ['eq', false], folds: ['folds', false], grat: ['grat', true], tiled: ['tiled', true], limit: ['limit', true] };
// hub、to 是已經移除的航空網路功能留下的，舊連結打開時順便清掉
const URL_KEYS = ['v', 'trip', 'rt', 'range', 'hub', 'to', ...Object.values(TOGGLES).map(x => x[0])];
const codes = list => list.map(i => airports[i].iata).join(',');
const round2 = x => String(Math.round(x * 100) / 100);

function buildURL() {
  const url = new URL(location.href), q = url.searchParams;
  URL_KEYS.forEach(k => q.delete(k));
  if (state.yaw || state.pitch || state.roll) q.set('v', [state.yaw, state.pitch, state.roll].map(round2).join(','));
  for (const [id, [key, def]] of Object.entries(TOGGLES)) if (state[id] !== def) q.set(key, state[id] ? '1' : '0');
  if (trip.stops.length) q.set('trip', codes(trip.stops));
  if (!document.getElementById('roundTrip').checked) q.set('rt', '0');
  if (rangeOn()) q.set('range', `${airports[range.ap].iata},${round2(range.value)}${range.unit === 'h' ? 'h' : ''}`);
  // 逗號不需要編碼，網址比較好讀
  return url.toString().replace(/%2C/g, ',');
}
// 拖曳時會一直呼叫，稍等一下再寫
function scheduleSync() {
  if (!urlReady) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { try { history.replaceState(null, '', buildURL()); } catch (e) { /* 不能改網址就算了 */ } }, 250);
}

// 地圖的方向和選項：一開始就能套用
function applyViewFromURL() {
  const q = new URLSearchParams(location.search);
  for (const [id, [key]] of Object.entries(TOGGLES)) {
    if (!q.has(key)) continue;
    state[id] = q.get(key) === '1';
    document.getElementById(id).checked = state[id];
  }
  const v = (q.get('v') || '').split(',').map(Number);
  if (v.length === 3 && v.every(Number.isFinite)) {
    [state.yaw, state.pitch, state.roll] = v;
    // 角度超出上下拖曳的限制時，關掉限制，才能還原同樣的畫面
    if (state.limit && (state.pitch < -1e-6 || state.pitch > SOUTH_PITCH + 1e-6)) {
      state.limit = false; document.getElementById('limit').checked = false;
    }
    rollInput.value = Math.round(state.roll);
  }
  if (q.get('rt') === '0') document.getElementById('roundTrip').checked = false;
}

// 行程、範圍圈：機場資料載入後才能套用。找不到的代碼直接略過
function applyDataFromURL() {
  const q = new URLSearchParams(location.search);
  const parse = s => (s || '').split(',').map(c => apByCode[c.trim().toUpperCase()]).filter(i => i !== undefined);
  const stops = parse(q.get('trip'));
  trip.stops = stops.slice(0, MAX_STOPS);
  trip.dropped = stops.slice(MAX_STOPS).map(i => airports[i].iata);
  if (trip.dropped.length) setSheet(true);   // 手機面板收著會看不到提示
  if (!q.has('v')) keepRouteInView(false, 0);  // 網址沒指定角度，就轉到看得到整趟路線
  const r = (q.get('range') || '').split(',');
  if (r.length === 2 && apByCode[r[0].toUpperCase()] !== undefined) {
    const hours = /h$/i.test(r[1]), val = parseFloat(r[1]);
    if (val > 0) {
      range.unit = hours ? 'h' : 'km';
      for (const b of document.getElementById('rgUnit').children) b.classList.toggle('on', b.dataset.unit === range.unit);
      rgValue.value = val;
      readRadius();
      range.ap = apByCode[r[0].toUpperCase()]; range.v = airports[range.ap].v;
    }
  }
  trip.legsCache = null;
  urlReady = true;
}

// 複製分享連結
document.getElementById('share').onclick = async () => {
  const btn = document.getElementById('share'), url = buildURL();
  try { history.replaceState(null, '', url); } catch (e) { /* 略過 */ }
  let ok = false;
  try { await navigator.clipboard.writeText(url); ok = true; } catch (e) { /* 沒有剪貼簿權限，改用舊方法 */ }
  if (!ok) {
    const ta = document.createElement('textarea');
    ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
  }
  // 真的複製不了：網址已經更新在網址列，請使用者自己複製
  btn.textContent = t(ok ? 'copied' : 'copyManually');
  setTimeout(() => { btn.textContent = t('share'); }, ok ? 1500 : 4000);
};

mapHooks.tint = () => (rangeOn() ? { v: range.v, cos: Math.cos(rangeAngle()) } : null);
mapHooks.layers = (x0, x1, y0, y1) => {
  drawRange(x0, x1, y0, y1);
  drawTrip(x0, x1, y0, y1);
};

// ---------------------------------------------------------------------------
// 啟動
// ---------------------------------------------------------------------------
resize();
readBg();
fitView();
applyViewFromURL();
updateMatrix();
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json', {
  integrity: 'sha384-Aw4s9pX1PTPntIYkZ/qV9IYiF5Gv8eTl6Dd/TT56zfO1Wwd+owFwYUuuXNUMrWkc',
  mode: 'cors', credentials: 'omit', referrerPolicy: 'no-referrer',
})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => {
    topo = data;
    features = topojson.feature(topo, topo.objects.countries).features;
    assignColors();
    buildTexture();
    buildIdTexture();
    document.getElementById('status').remove();
    requestDraw();
  })
  .catch(err => {
    document.getElementById('status').textContent = t('mapFail', { msg: err.message });
  });
</script>
